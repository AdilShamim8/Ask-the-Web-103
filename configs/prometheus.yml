# Prometheus scrape configuration.
#
# NOTE: docker-compose.yml mounts this file into the prometheus container.
# Before 2026-10-16 this file did not exist in the repo while compose still
# mounted it — every `docker compose up` failed to start monitoring.
# See CHANGELOG and FMEA FM-17.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    service: ask-the-web
    env: ${APP_ENV:docker}

scrape_configs:
  # The application itself (FastAPI, /metrics via prometheus_client)
  - job_name: ask-web-api
    metrics_path: /metrics
    static_configs:
      - targets: ["agent:8000"]
        labels:
          tier: api

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

# Alerting rules that map 1:1 to the FMEA register.
rule_files:
  - /etc/prometheus/alerts.yml

# (alerts.yml is provisioned by the deploy pipeline; see deploy/k8s/)

# Namespace + configuration for Ask-the-Web on Kubernetes.
# Apply order: 01-configmap → 02-deployment → 03-hpa-pdb
# Secrets are NOT in this file (see secret template note below) — apply
# real secrets out-of-band (kubectl create secret / external-secrets).

apiVersion: v1
kind: Namespace
metadata:
  name: ask-web
  labels:
    app.kubernetes.io/name: ask-the-web
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ask-web-config
  namespace: ask-web
  labels:
    app.kubernetes.io/name: ask-the-web
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  API_VERSION: "2.0.0"
  DEFAULT_LLM_PROVIDER: "openai"
  DEFAULT_MODEL: "gpt-4o"
  FAST_MODEL: "gpt-4o-mini"
  LLM_PROVIDER_ORDER: "openai,anthropic"
  SEARCH_PROVIDER: "tavily"
  SEARCH_PROVIDER_ORDER: "tavily,serpapi"
  REDIS_URL: "redis://ask-web-redis:6379/0"

  # Budgets (ADR-005) — tuned for the launch tier; see
  # docs/architecture/capacity-planning.md before raising these.
  BUDGET_MAX_INPUT_TOKENS: "120000"
  BUDGET_MAX_OUTPUT_TOKENS: "16000"
  BUDGET_MAX_TOOL_CALLS: "25"
  BUDGET_MAX_STEPS: "12"
  BUDGET_DEADLINE_S: "45"

  # Rate limiting (global via Redis)
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW: "60"

  # Tool safety (FM-08/FM-09)
  MAX_RESPONSE_BYTES: "3000000"
  MAX_TOOL_RESULT_CHARS: "8000"
  MAX_PARALLEL_TOOL_CALLS: "5"

  # Cache (ADR-003)
  CACHE_TTL_S: "3600"
  CACHE_STALE_S: "600"
  CACHE_JITTER_RATIO: "0.3"
  CACHE_LOCK_TTL_MS: "8000"
  CACHE_WAIT_MS: "5000"

  # Timeouts
  LLM_TIMEOUT: "60"
  SEARCH_TIMEOUT: "15"
  SCRAPE_TIMEOUT: "20"
  TOOL_TIMEOUT_S: "15"
---
# SECRET TEMPLATE — do NOT commit real values.
# Create the real secret with:
#   kubectl -n ask-web create secret generic ask-web-secrets \
#     --from-literal=OPENAI_API_KEY=... \
#     --from-literal=ANTHROPIC_API_KEY=... \
#     --from-literal=TAVILY_API_KEY=... \
#     --from-literal=SERPAPI_API_KEY=...
---
apiVersion: v1
kind: Service
metadata:
  name: ask-web-api
  namespace: ask-web
  labels:
    app.kubernetes.io/name: ask-the-web
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ask-the-web
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: ask-web-redis
  namespace: ask-web
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379

# API deployment — stateless pods, surge-only rollouts, SSE-aware drain.
# Safety parameters documented in docs/DEPLOYMENT.md §Rollout.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ask-web-api
  namespace: ask-web
  labels:
    app.kubernetes.io/name: ask-the-web
    app.kubernetes.io/component: api
spec:
  replicas: 3                      # HPA takes over (03-hpa-pdb.yaml)
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%                # scale up fast
      maxUnavailable: 0            # NEVER drop below desired capacity
  selector:
    matchLabels:
      app.kubernetes.io/name: ask-the-web
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ask-the-web
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 45   # drain in-flight SSE streams
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/adilshamim8/ask-the-web-103:v2.0.2   # pinned semver; bump via PR + kubectl rollout restart
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ask-web-config
            - secretRef:
                name: ask-web-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          # Liveness: process-level CHEAP probe (matches /healthz contract —
          # a wedged event loop must trigger restart, a slow provider must not)
          livenessProbe:
            httpGet:
              path: /v1/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: deep checks (registry, Redis, breakers) — gate traffic
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          # Startup: Playwright + venv warm-up before probes apply
          startupProbe:
            httpGet:
              path: /v1/healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:               # let the LB deregister before SIGTERM
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # playwright writes temp profiles
            capabilities:
              drop: ["ALL"]
---
# Redis: single primary for the launch tier; cluster at 10M+ DAU
# (capacity-planning §4). AOF persistence, LRU eviction for the
# response-cache working set.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ask-web-redis
  namespace: ask-web
  labels:
    app.kubernetes.io/name: redis
spec:
  serviceName: ask-web-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 2gb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2.5Gi"
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

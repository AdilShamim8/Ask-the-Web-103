# CI — the merge bar. Mirrors CONTRIBUTING.md's local commands:
#   make lint && make typecheck && make test
# plus the compile gate and an image boot smoke test.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Test keys (fake): the suite fakes providers at the core/ boundary.
  OPENAI_API_KEY: sk-ci-not-real
  ANTHROPIC_API_KEY: sk-ant-ci-not-real
  TAVILY_API_KEY: tvly-ci-not-real

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .

  typecheck:
    name: Types (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install project + mypy
        run: pip install -e ".[dev]"
      - name: Mypy
        # Hard gate since 2026-10-16: the codebase is mypy-clean
        # (51 source files, zero findings). Baseline mode with
        # ignore-missing-imports; ratchets toward strict in planned
        # increments — see ADR-006.
        run: mypy core tools agents workflows api evaluation --ignore-missing-imports

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install project
        run: |
          pip install -e ".[dev]"
          playwright install chromium --with-deps || true
      - name: Compile check (every module must parse)
        run: python -m compileall -q core configs tools agents workflows api evaluation tests
      - name: Pytest
        run: pytest tests/ -v --cov=core --cov=tools --cov=workflows --cov=agents --cov=api --cov-report=term-missing --cov-fail-under=50
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7

  image-smoke:
    name: Image build + boot smoke
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - name: Build runtime image
        run: docker build --target runtime -t ask-web-ci:sha .
      - name: Boot + healthcheck smoke
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e OPENAI_API_KEY=sk-ci-not-real \
            -e TAVILY_API_KEY=tvly-ci-not-real \
            ask-web-ci:sha
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/v1/healthz > /dev/null 2>&1; then
              echo "HEALTH OK after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "healthcheck failed"; docker logs smoke; exit 1

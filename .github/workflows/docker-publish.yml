# Docker publish — build, smoke-test, THEN push.
# Images are never published from a commit whose container fails to
# boot and pass the healthcheck (FM-17).

name: Docker Publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build → smoke → push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build (load locally for smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: ask-web-release:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot smoke test (healthcheck must pass)
        run: |
          docker run -d --name release-smoke -p 8000:8000 \
            -e OPENAI_API_KEY=sk-ci-not-real \
            ask-web-release:candidate
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:8000/v1/healthz > /dev/null 2>&1; then
              echo "smoke OK"; docker rm -f release-smoke; exit 0
            fi
            sleep 1
          done
          echo "smoke FAILED"; docker logs release-smoke; docker rm -f release-smoke; exit 1

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ask-the-web-agent"
version = "2.0.2"
description = "A production-grade, Perplexity-like Ask-the-Web Agent — ReACT, ReWOO, Reflexion, Tree Search, MCP, A2A, budgets, and graceful degradation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    # LLM providers
    "openai>=1.30.0",
    "anthropic>=0.25.0",
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "gunicorn>=22.0.0",
    # HTTP
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    # Security floor (fixed 2026-10-16): trivy flagged CVE-2026-97687 /
    # CVE-2026-97689 in urllib3 2.7.0. The resolver picked 2.8.0 anyway,
    # but an explicit floor protects against future resolver regressions.
    "urllib3>=2.8.0",
    # Scraping
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    # Config + validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # State
    "redis>=5.0.0",            # NOTE: aioredis removed — merged into redis-py
    # Tokens
    "tiktoken>=0.7.0",
    # Resilience
    "tenacity>=8.3.0",
    # Observability
    "structlog>=24.2.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    # Providers
    "serpapi>=0.1.5",
    "tavily-python>=0.3.0",
    # CLI polish
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pip-audit>=2.7.0",
    "types-beautifulsoup4",
]

[tool.hatch.build.targets.wheel]
# Flat layout: the importable top-level packages shipped in the wheel.
# Without this table, hatchling's default heuristic searches for a
# package named `ask_the_web_agent/`, finds nothing, and every install
# (`pip install -e .[dev]` in CI, `pip install .` in the Docker builder
# stage) dies at metadata-generation time. Fixed 2026-10-16.
packages = [
    "core",
    "configs",
    "tools",
    "agents",
    "workflows",
    "api",
    "evaluation",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]   # test fixtures may use flexible naming

[tool.mypy]
python_version = "3.11"
strict = false                    # baseline mode; ratcheting toward strict
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:playwright.*",
]

[tool.coverage.run]
source = ["core", "tools", "workflows", "agents", "api"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
